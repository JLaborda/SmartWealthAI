[project]
name = "smartwealthai"
version = "0.1.0"
description = "AI-driven financial screener and portfolio manager"
authors = [
    {name = "Jorge Laborda",email = "jdlsicilia@gmail.com"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "yfinance (>=1.2.0,<2.0.0)",
    "pandas (>=3.0.1,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "ruff (>=0.15.14,<0.16.0)"
]
