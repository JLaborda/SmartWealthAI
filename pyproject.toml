[project]
name = "smartwealthai"
version = "0.1.0"
description = "AI-driven financial screener and portfolio manager"
authors = [
    { name = "Jorge Laborda", email = "jdlsicilia@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "credit",
    "investing",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["credit", "investing"]

[tool.uv.sources]
credit = { workspace = true }
investing = { workspace = true }

[dependency-groups]
# Full-workspace `make install`. Member packages declare their own `dev` groups for
# `uv sync --package {credit|investing} --group dev` (uv does not inherit root groups).
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "ruff>=0.15.14,<0.16.0",
    "httpx>=0.28.0,<1.0.0",  # credit FastAPI TestClient (also on credit/dev)
]

[tool.pytest.ini_options]
testpaths = ["investing/tests", "credit/tests"]
pythonpath = ["investing/src", "credit/src"]
markers = [
    "integration: requires network or AWS (excluded from PR CI)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["investing/src", "credit/src", "investing/tests", "credit/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["investing", "credit"]
branch = true
# Frozen SEC ETL spike (phase 2) — excluded from demo coverage metrics.
# Test trees are measured by pytest but must not enter Codecov patch/project %.
omit = [
    "*/tests/*",
    "investing/src/investing/sec_client.py",
    "investing/src/investing/edgartools_client.py",
    "investing/src/investing/download_fundamentals.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
