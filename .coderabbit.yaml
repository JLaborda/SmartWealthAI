# CodeRabbit configuration for SmartWealthAI.
# Enables automatic PR reviews for PRs targeting main or develop
# (develop is the active integration branch for the June 30 demo slice).
reviews:
  auto_review:
    # Do not auto-review draft PRs; only ready-for-review PRs
    drafts: false
    base_branches:
      - "main"
      - "develop"
