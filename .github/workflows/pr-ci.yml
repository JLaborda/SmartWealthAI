name: Tests

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install dependencies (full workspace)
        run: make install

      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        domain: [credit, investing]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install ${{ matrix.domain }}-only
        run: make install-${{ matrix.domain }}

      # Bare `uv run` re-syncs the full workspace (root depends on both members).
      # Use --no-sync after --package sync, or uv run --package, for isolation.
      - name: Assert cross-domain deps absent
        run: |
          if [ "${{ matrix.domain }}" = "credit" ]; then
            ! uv run --no-sync python -c "import yfinance" \
              || { echo "FAIL: yfinance must not install with credit-only sync"; exit 1; }
            uv run --no-sync python -c "import credit"
            uv run --no-sync credit-css --help
          else
            ! uv run --no-sync python -c "import xgboost" \
              || { echo "FAIL: xgboost must not install with investing-only sync"; exit 1; }
            uv run --no-sync python -c "import investing"
            uv run --no-sync score-universe --help
          fi

      - name: Test ${{ matrix.domain }} with coverage
        run: make test-${{ matrix.domain }} COV_ARGS='--cov-report=xml'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: ${{ matrix.domain }}
          fail_ci_if_error: false
