version: simfin_mapping_v1

# SimFin bulk column names → curated canonical fields (see etl-data-lake.md).
fields:
  ebit: "Operating Income (Loss)"
  revenue: Revenue
  net_income: "Net Income"
  current_assets: "Total Current Assets"
  current_liabilities: "Total Current Liabilities"
  cash: "Cash, Cash Equivalents & Short Term Investments"
  short_term_debt: "Short Term Debt"
  ppe_net: "Property, Plant & Equipment, Net"
  long_term_debt: "Long Term Debt"
  preferred_equity: "Preferred Equity"
  minority_interest: "Minority Interest"
  total_assets: "Total Assets"
  total_liabilities: "Total Liabilities"
  shares_outstanding: "Shares (Basic)"
  # QV forensic / FS-Score inputs (Beneish YoY deltas, Gray/Carlisle components)
  accounts_receivable: "Accounts Receivable"
  cost_of_revenue: "Cost of Revenue"
  depreciation_amortization: "Depreciation & Amortization"
  sga_expense: "Selling, General & Administrative"
  operating_cash_flow: "Net Cash from Operating Activities"

meta:
  ticker: Ticker
  simfin_id: SimFinId
  cik: CIK
  currency: Currency
  report_date: "Report Date"
  publish_date: "Publish Date"
  restated_date: "Restated Date"
  fiscal_year: "Fiscal Year"
  fiscal_period: "Fiscal Period"

qv_required_fields:
  - accounts_receivable
  - cost_of_revenue
  - depreciation_amortization
  - sga_expense
  - operating_cash_flow

# ponytail: single lag when Publish Date is missing (quarterly default from architecture).
missing_publish_lag_days: 45
